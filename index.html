<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hintonn AI — AI Automation & Intelligence</title>
  <meta name="description" content="Hintonn AI is an enterprise AI operating system for business automation, intelligent orchestration, and project intelligence.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <!-- Favicon: Hexagonal H mark with Hintonn Intelligence Gradient -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='10' y1='10' x2='90' y2='90' gradientUnits='userSpaceOnUse'><stop offset='0%25' stop-color='%230099FF'/><stop offset='50%25' stop-color='%232563EB'/><stop offset='100%25' stop-color='%238B2CF5'/></linearGradient></defs><polygon points='50,6 90,28 90,72 50,94 10,72 10,28' stroke='url(%23g)' stroke-width='8' stroke-linejoin='round' stroke-linecap='round' fill='%23FFFFFF'/><path fill='url(%23g)' d='M33 33.5A3.5 3.5 0 0 1 36.5 30h3A3.5 3.5 0 0 1 43 33.5V45h14v-11.5a3.5 3.5 0 0 1 3.5-3.5h3a3.5 3.5 0 0 1 3.5 3.5v33a3.5 3.5 0 0 1-3.5 3.5h-3a3.5 3.5 0 0 1-3.5-3.5V55H43v11.5A3.5 3.5 0 0 1 39.5 70h-3a3.5 3.5 0 0 1-3.5-3.5v-33z'/></svg>">
  
  <!-- Google Fonts: Manrope (Display/KPIs), Inter (UI/Body), JetBrains Mono (Tech) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tokens.css?v=pmo29">
  <link rel="stylesheet" href="css/base.css?v=pmo29">
  <link rel="stylesheet" href="css/layout.css?v=pmo29">
  <link rel="stylesheet" href="css/components.css?v=pmo35">
  <link rel="stylesheet" href="css/login.css?v=pmo29">
</head>
<body>
  <!-- Mobile Sidebar Backdrop -->
  <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="App.closeSidebar()" aria-hidden="true"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header" id="top-brand-area">
        <div class="sidebar-header-row">
          <a href="#dashboard" class="sidebar-brand brand-logo brand-wrapper brand-container" title="Hintonn AI" onclick="if(window.innerWidth<=768)App.closeSidebar()">
            <img 
              src="assets/hintonn-sidebar-logo.jpeg" 
              alt="Hintonn AI" 
              class="brand-logo-img"
              style="height: 44px; width: auto; max-width: 220px; object-fit: contain; display: block; image-rendering: -webkit-optimize-contrast; mix-blend-mode: multiply; background: transparent !important;"
            />
          </a>
          <div class="sidebar-header-actions">
            <button class="sidebar-close-btn" onclick="App.closeSidebar()" aria-label="Close navigation menu">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <button class="topbar-btn mobile-menu" id="mobile-menu-btn" onclick="App.toggleSidebar()" aria-label="Open navigation menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        
        <div class="topbar-breadcrumb" id="breadcrumb"></div>

        <div class="topbar-spacer"></div>

        <div class="topbar-search" id="globalSearch" onclick="App.openCommand()" role="button" aria-label="Search or command palette">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="search-text">Search anything...</span>
          <span class="shortcut">⌘ K</span>
        </div>

        <div class="topbar-actions">
          <button class="topbar-btn" onclick="App.toggleNotifications(event)" title="Notifications" id="notif-btn" aria-label="View notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="notif-dot hidden" id="notif-dot"></span>
          </button>
        </div>

        <div class="topbar-user-wrap" style="position:relative">
          <div class="topbar-avatar" id="topbar-avatar" title="User Profile" onclick="Topbar.toggleUserMenu(event)">PB</div>
          <div class="topbar-user-dropdown profile-dropdown" id="profileDropdown" data-id="topbar-user-dropdown" style="display:none"></div>
        </div>
      </header>

      <main class="page-content" id="page-content"></main>
    </div>
  </div>

  <!-- Mobile Bottom Navigation Bar (Screens <= 768px) -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile Navigation">
    <a href="#dashboard" class="mobile-nav-item" data-nav="dashboard" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="#projects" class="mobile-nav-item" data-nav="projects" aria-label="Projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
      <span>Projects</span>
    </a>
    <a href="#tasks" class="mobile-nav-item" data-nav="tasks" aria-label="Tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <span>Tasks</span>
    </a>
    <a href="#ai-assistant" class="mobile-nav-item mobile-nav-ai" data-nav="ai-assistant" aria-label="AI Copilot">
      <div class="mobile-nav-ai-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
      </div>
      <span>AI Copilot</span>
    </a>
    <button class="mobile-nav-item mobile-nav-menu-btn" onclick="App.toggleSidebar()" aria-label="More navigation menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      <span>Menu</span>
    </button>
  </nav>

  <div class="notification-panel hidden" id="notification-panel">
    <div class="notification-panel-header">
      <div style="display:flex;align-items:center;gap:10px">
        <h3>Notifications</h3>
        <span class="badge badge-primary" id="notif-panel-count" style="font-size:11px"></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="Store.markAllRead(); App.renderNotifications(); App.updateNotifDot(); Toast.show('All notifications marked as read', 'success');">Mark all read</button>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="App.closeNotifications()" title="Close notifications (Esc)" aria-label="Close notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="notification-panel-body" id="notification-list"></div>
  </div>

  <div class="command-overlay hidden" id="command-overlay" onclick="if(event.target===this)App.closeCommand()">
    <div class="command-palette" id="searchModal" data-modal="globalSearch">
      <div class="command-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="command-input" id="command-input" placeholder="Search projects, tasks, AI agents, or type a command..." oninput="App.onCommandSearch(this.value)">
        <button type="button" id="command-search-clear" class="search-clear-btn hidden" onclick="Command.clearSearch()" title="Clear search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="command-results" id="command-results"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

  <!-- Scripts -->
  <script src="js/firebase-auth.js?v=pmo37"></script>
  <script src="js/fcm.js?v=pmo37"></script>
  <script src="js/store.js?v=pmo37"></script>
  <script src="js/auth.js?v=pmo37"></script>
  <script src="js/components/icons.js?v=pmo37"></script>
  <script src="js/components/sidebar.js?v=pmo37"></script>
  <script src="js/components/topbar.js?v=pmo37"></script>
  <script src="js/components/modal.js?v=pmo37"></script>
  <script src="js/components/toast.js?v=pmo37"></script>
  <script src="js/components/command.js?v=pmo37"></script>
  <script src="js/screens/login.js?v=pmo37"></script>
  <script src="js/screens/dashboard.js?v=pmo37"></script>
  <script src="js/screens/billing.js?v=pmo37"></script>
  <script src="js/screens/retention.js?v=pmo37"></script>
  <script src="js/screens/bank-guarantees.js?v=pmo37"></script>
  <script src="js/screens/dlp.js?v=pmo37"></script>
  <script src="js/screens/projects.js?v=pmo37"></script>
  <script src="js/screens/project-detail.js?v=pmo37"></script>
  <script src="js/screens/tasks.js?v=pmo37"></script>
  <script src="js/screens/timeline.js?v=pmo37"></script>
  <script src="js/screens/team.js?v=pmo37"></script>
  <script src="js/screens/calendar.js?v=pmo37"></script>
  <script src="js/screens/reports.js?v=pmo37"></script>
  <script src="js/screens/issues.js?v=pmo37"></script>
  <script src="js/screens/milestones.js?v=pmo37"></script>
  <script src="js/screens/ai-assistant.js?v=pmo37"></script>
  <script src="js/screens/connectors.js?v=pmo37"></script>
  <script src="js/screens/notifications.js?v=pmo37"></script>
  <script src="js/screens/settings.js?v=pmo37"></script>
  <script src="js/screens/user-approvals.js?v=pmo37"></script>
  <script src="js/app.js?v=pmo37"></script>
</body>
</html>
